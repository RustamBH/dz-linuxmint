apiVersion: apps/v1
kind: Deployment
metadata:
  name: converter-deployment
spec:
  replicas: 5
  selector:
    matchLabels:
      components: frontend
  template:
    metadata:
      name: converter
      labels:
        components: frontend
    spec:
      containers:
      - name: converter
        image: antonlarichev/converter
        ports:
        - containerPort: 80
        env:
          - name: AMQP_EXCHANGE
            valueFrom:
              secretKeyRef:
                name: converter-secret
                key: AMQP_EXCHANGE
          - name: AMQP_USER
            valueFrom:
              secretKeyRef:
                name: converter-secret
                key: AMQP_USER
          - name: AMQP_PASSWORD
            valueFrom:
              secretKeyRef:
                name: converter-secret
                key: AMQP_PASSWORD
          - name: AMQP_HOSTNAME
            valueFrom:
              secretKeyRef:
                name: converter-secret
                key: AMQP_HOSTNAME
          - name: AMQP_QUEUE                
            valueFrom:
              secretKeyRef:
                name: converter-secret
                key: AMQP_QUEUE                                                                    
        resources:
          limits:
            memory: "128Mi"
            cpu: "100m"