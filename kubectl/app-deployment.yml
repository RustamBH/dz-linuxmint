apiVersion: apps/v1
kind: Deployment
metadata:
  name: conv-app-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      components: frontend
  template:
    metadata:
      name: conv-app
      labels:
        components: frontend
    spec:
      containers:
      - name: conv-app
        image: antonlarichev/conv-app
        ports:
        - containerPort: 80   
        env:
          - name: VITE_DOMAIN
            valueFrom:
              configMapKeyRef:
                name: demo-config
                key: VITE_DOMAIN      
        resources:
          limits:
            memory: "128Mi"
            cpu: "100m"
      volumes:
        - name: test
          configMap:
            name: demo-config