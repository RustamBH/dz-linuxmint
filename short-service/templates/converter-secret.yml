apiVersion: v1
kind: Secret
metadata:
  name: "{{ .Values.converter.name }}-secret"
type: Opaque
data:  
  AMQP_EXCHANGE: {{ .Values.cnv.exchange | b64enc }}
  AMQP_USER: {{ .Values.cnv.user | b64enc }}
  AMQP_PASSWORD: {{ .Values.cnv.password | b64enc }}
  AMQP_HOSTNAME: {{ .Values.cnv.hostname | b64enc }}
  AMQP_QUEUE: {{ .Values.cnv.queue | b64enc }}