apiVersion: apps/v1
kind: Deployment
metadata:
  name: conv-api-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      components: frontend
  template:
    metadata:
      name: conv-api
      labels:
        components: frontend
    spec:
      containers:
      - name: conv-api
        image: antonlarichev/conv-api:1.2
        ports:
        - containerPort: 80
        env:
          - name: SEED_USERNAME
            valueFrom:
              secretKeyRef:
                name: conv-api-secret
                key: SEED_USERNAME
          - name: SEED_USER_PASSWORD
            valueFrom:
              secretKeyRef:
                name: conv-api-secret
                key: SEED_USER_PASSWORD
          - name: AMQP_EXCHANGE
            valueFrom:
              secretKeyRef:
                name: conv-api-secret
                key: AMQP_EXCHANGE
          - name: AMQP_USER
            valueFrom:
              secretKeyRef:
                name: conv-api-secret
                key: AMQP_USER
          - name: AMQP_PASSWORD
            valueFrom:
              secretKeyRef:
                name: conv-api-secret
                key: AMQP_PASSWORD
          - name: AMQP_HOSTNAME
            valueFrom:
              secretKeyRef:
                name: conv-api-secret
                key: AMQP_HOSTNAME                                                       
        resources:
          limits:
            memory: "128Mi"
            cpu: "100m"
        volumeMounts:
          - name: conv-api-data
            mountPath: /opt/app/uploads
            subPath: img
      volumes:
        - name: conv-api-data
          persistentVolumeClaim:          
            claimName: conv-api-pvc