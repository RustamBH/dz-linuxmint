apiVersion: apps/v1
kind: Deployment
metadata:
  name: rmq-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      components: rabbitmq
  template:
    metadata:
      labels:
        components: rabbitmq
    spec:
      containers:
      - name: rabbitmq
        image: rabbitmq:4.2.2
        ports:
        - containerPort: 5672
        env:
        - name: $(SEED_USERNAME)          
        - name: $(SEED_USER_PASSWORD)              
        resources:
          limits:
            memory: "500Mi"
            cpu: "300m"
        volumeMounts:
          - name: rabbitmq-data
            mountPath: /var/lib/rabbitmq
            subPath: mnesia
      volumes:
        - name: rabbitmq-data
          persisitentVolumeClaim:
            ClaimName: rabbitmq-pvc